name: "Generate ASCII banner GIF"
description: >-
  Gera um banner ASCII animado a partir de um texto (o seu nome, por exemplo):
  o texto é desenhado com caracteres (#) linha a linha, de cima para baixo,
  monocromático e com fundo transparente. Roda direto no GitHub Actions e
  entrega o GIF no workspace do seu repositório.

inputs:
  text:
    description: "Texto do banner. Use \\n para várias linhas."
    required: false
    default: "LUCAS KAWATOKO"
  pad_rows:
    description: "Linhas de respiro em cima e embaixo do banner."
    required: false
    default: "3"
  color:
    description: "Cor da tinta em hex (#rrggbb). Vazio usa cinza claro (#c9d1d9)."
    required: false
    default: ""
  output:
    description: "Caminho de saída do GIF (relativo à raiz do repositório)."
    required: false
    default: "imgs/profile-ascii.gif"

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install -r "${{ github.action_path }}/../../../requirements.txt"
      shell: bash

    - name: Generate ASCII banner
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH/../../.."
        test -f generator/main.py || {
          echo "generator/main.py não encontrado. GITHUB_ACTION_PATH=$GITHUB_ACTION_PATH"
          exit 1
        }
        COLOR_ARGS=()
        if [ -n "$INPUT_COLOR" ]; then COLOR_ARGS=(--color "$INPUT_COLOR"); fi
        python -m generator --ascii \
          --text "$INPUT_TEXT" \
          --pad-rows "$INPUT_PAD_ROWS" \
          "${COLOR_ARGS[@]}" \
          --output "$RUNNER_TEMP/ascii.gif"
        install -D -m 644 "$RUNNER_TEMP/ascii.gif" "$GITHUB_WORKSPACE/$INPUT_OUTPUT"
      env:
        INPUT_TEXT: ${{ inputs.text }}
        INPUT_PAD_ROWS: ${{ inputs.pad_rows }}
        INPUT_COLOR: ${{ inputs.color }}
        INPUT_OUTPUT: ${{ inputs.output }}
      shell: bash
