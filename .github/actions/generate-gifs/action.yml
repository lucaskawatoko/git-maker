name: "Generate contribution GIF"
description: >-
  Gera o GIF Asteroids com os repositórios públicos do usuário virando
  cometas (um por vez). Sem servidor: roda direto no GitHub Actions e commita
  o GIF no seu repositório.

inputs:
  username:
    description: "Usuário do GitHub cujos repositórios serão usados."
    required: false
    default: "lucaskawatoko"
  limit:
    description: "Máximo de cometas (0 = todos, um por vez)."
    required: false
    default: "0"
  output:
    description: "Caminho de saída do GIF (relativo à raiz do repositório)."
    required: false
    default: "imgs/contribution-animation.gif"

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install -r "${{ github.action_path }}/../../../requirements.txt"
      shell: bash

    - name: Generate GIF
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH/../../.."
        test -f generator/main.py || {
          echo "generator/main.py não encontrado. GITHUB_ACTION_PATH=$GITHUB_ACTION_PATH"
          exit 1
        }
        python -m generator \
          --user "$INPUT_USERNAME" \
          --limit "$INPUT_LIMIT" \
          --output "$INPUT_OUTPUT"
      env:
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_LIMIT: ${{ inputs.limit }}
        INPUT_OUTPUT: ${{ inputs.output }}
      shell: bash
