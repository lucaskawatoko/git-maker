name: "Generate GitHub snake GIF"
description: >-
  Gera o GIF da cobrinha comendo os dados do GitHub (repositórios,
  contribuições ou seguidores). Cor da cobrinha e da comida personalizáveis por
  hex, fundo transparente e avatar do usuário na cabeça. Sem servidor: roda
  direto no GitHub Actions e commita o GIF no seu repositório.

inputs:
  username:
    description: "Usuário do GitHub cujos dados serão usados."
    required: false
    default: "lucaskawatoko"
  data:
    description: "Dados que viram comida: repos (repositórios), commits (contribuições) ou followers (seguidores)."
    required: false
    default: "repos"
  game:
    description: "Estilo do jogo: snake (cobrinha) ou breakout (quebra-blocos)."
    required: false
    default: "snake"
  color:
    description: "Cor da cobrinha em hex (#rrggbb), ex: #aac8d6 (azul calcinha)."
    required: false
    default: "#3fb950"
  food:
    description: "Cor da comida em hex (#rrggbb). Vazio usa o padrão #ff6b4a."
    required: false
    default: ""
  output:
    description: "Caminho de saída do GIF (relativo à raiz do repositório)."
    required: false
    default: "imgs/contribution-animation.gif"
  seed:
    description: "Semente da simulação (opcional). Vazio = caminho aleatório a cada geração."
    required: false
    default: ""
  smooth:
    description: "Movimento interpolado (mais fluido, GIF maior): 'true' ou 'false'."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install -r "${{ github.action_path }}/../../../requirements.txt"
      shell: bash

    - name: Generate GIF
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH/../../.."
        test -f generator/main.py || {
          echo "generator/main.py não encontrado. GITHUB_ACTION_PATH=$GITHUB_ACTION_PATH"
          exit 1
        }
        SEED_ARGS=()
        if [ -n "$INPUT_SEED" ]; then SEED_ARGS=(--seed "$INPUT_SEED"); fi
        SMOOTH_ARGS=()
        if [ "$INPUT_SMOOTH" = "false" ]; then SMOOTH_ARGS=(--no-smooth); fi
        python -m generator \
          --user "$INPUT_USERNAME" \
          --data "$INPUT_DATA" \
          --game "$INPUT_GAME" \
          --color "$INPUT_COLOR" \
          --food "$INPUT_FOOD" \
          "${SEED_ARGS[@]}" \
          "${SMOOTH_ARGS[@]}" \
          --output "$RUNNER_TEMP/snake.gif"
        install -D -m 644 "$RUNNER_TEMP/snake.gif" "$GITHUB_WORKSPACE/$INPUT_OUTPUT"
      env:
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_DATA: ${{ inputs.data }}
        INPUT_GAME: ${{ inputs.game }}
        INPUT_COLOR: ${{ inputs.color }}
        INPUT_FOOD: ${{ inputs.food }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_SEED: ${{ inputs.seed }}
        INPUT_SMOOTH: ${{ inputs.smooth }}
      shell: bash
