name: "Generate GitHub contribution GIF"
description: >-
  Gera uma animação GIF de perfil (asteroids ou snake) a partir de dados
  públicos do GitHub (repositórios, contribuições ou seguidores). Sem servidor:
  roda direto no GitHub Actions e commita o GIF no seu repositório.

inputs:
  username:
    description: "Usuário do GitHub cujos dados serão usados."
    required: false
    default: "lucaskawatoko"
  style:
    description: "Estilo da animação: asteroids ou snake."
    required: false
    default: "asteroids"
  data:
    description: "Dados: repos, commits (contribuições) ou followers."
    required: false
    default: "repos"
  color:
    description: "Paleta: cyan, pink, green, orange, purple, blue ou uma cor hex (#rrggbb)."
    required: false
    default: "cyan"
  avatar:
    description: "Coloca o avatar do usuário na animação (true/false)."
    required: false
    default: "false"
  output:
    description: "Caminho de saída do GIF (relativo à raiz do repositório)."
    required: false
    default: "imgs/contribution-animation.gif"

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install -r "${{ github.action_path }}/../../requirements.txt"
      shell: bash

    - name: Generate GIF
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH/../.."
        AVATAR_ARG=""
        if [ "$INPUT_AVATAR" = "true" ]; then
          AVATAR_ARG="--avatar"
        fi
        python -m generator \
          --user "$INPUT_USERNAME" \
          --style "$INPUT_STYLE" \
          --data "$INPUT_DATA" \
          --color "$INPUT_COLOR" \
          $AVATAR_ARG \
          --output "$INPUT_OUTPUT"
      env:
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_STYLE: ${{ inputs.style }}
        INPUT_DATA: ${{ inputs.data }}
        INPUT_COLOR: ${{ inputs.color }}
        INPUT_AVATAR: ${{ inputs.avatar }}
        INPUT_OUTPUT: ${{ inputs.output }}
      shell: bash
