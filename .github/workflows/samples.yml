name: samples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generator/**"
      - ".github/actions/**"
      - ".github/workflows/samples.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sample (repos, verde)
        uses: ./.github/actions/generate-gifs
        with:
          username: ${{ vars.SAMPLE_USERNAME || 'lucaskawatoko' }}
          data: repos
          color: "#3fb950"
          seed: 42
          output: imgs/samples/snake-repos-green.gif

      - name: Generate sample (commits, azul calcinha)
        uses: ./.github/actions/generate-gifs
        with:
          username: ${{ vars.SAMPLE_USERNAME || 'lucaskawatoko' }}
          data: commits
          color: "#aac8d6"
          food: "#e5534b"
          seed: 42
          output: imgs/samples/snake-commits-azul-calcinha.gif

      - name: Generate sample (followers, roxo)
        uses: ./.github/actions/generate-gifs
        with:
          username: ${{ vars.SAMPLE_USERNAME || 'lucaskawatoko' }}
          data: followers
          color: "#a371f7"
          food: "#3fb950"
          seed: 42
          output: imgs/samples/snake-followers-roxo.gif

      - name: Generate sample (breakout, repos, amarelo)
        uses: ./.github/actions/generate-gifs
        with:
          username: ${{ vars.SAMPLE_USERNAME || 'lucaskawatoko' }}
          data: repos
          game: breakout
          color: "#e3b341"
          food: "#e5534b"
          seed: 42
          output: imgs/samples/breakout-repos-amarelo.gif

      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imgs/samples
          git diff --cached --quiet && echo "sem mudanças" || {
            git commit -m "chore: atualiza galeria de exemplos"
            git push
          }
