name: samples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generator/**"
      - ".github/actions/**"
      - ".github/workflows/samples.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sample GIF
        uses: ./.github/actions/generate-gifs
        with:
          username: ${{ vars.SAMPLE_USERNAME || 'lucaskawatoko' }}
          output: imgs/samples/asteroids.gif

      - name: Commit sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imgs/samples
          git diff --cached --quiet && echo "sem mudanças" || {
            git commit -m "chore: atualiza galeria de exemplos"
            git push
          }
