name: test

on:
  push:
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render snake GIF with mock data
        run: |
          python -m generator --data repos --mock --preview \
            --output "/tmp/snake.gif"
          test -s "/tmp/snake.gif"
          echo "OK snake (repos)"
      - name: Render snake with custom hex colors
        run: |
          python -m generator --data commits --mock \
            --color "#aac8d6" --food "#e5534b" \
            --output "/tmp/snake-azul.gif"
          test -s "/tmp/snake-azul.gif"
          echo "OK snake (hex)"
      - name: Render snake with followers (mock)
        run: |
          python -m generator --data followers --mock \
            --output "/tmp/snake-followers.gif"
          test -s "/tmp/snake-followers.gif"
          echo "OK snake (followers)"
      - name: Seeds diferentes geram caminhos diferentes
        run: |
          python -m generator --data repos --mock --seed 1 --output "/tmp/seed1.gif"
          python -m generator --data repos --mock --seed 2 --output "/tmp/seed2.gif"
          test -s "/tmp/seed1.gif" && test -s "/tmp/seed2.gif"
          ! cmp -s /tmp/seed1.gif /tmp/seed2.gif
          echo "OK seeds"
      - name: Seed fixo é reproduzível
        run: |
          python -m generator --data repos --mock --seed 7 --output "/tmp/r1.gif"
          python -m generator --data repos --mock --seed 7 --output "/tmp/r2.gif"
          cmp -s /tmp/r1.gif /tmp/r2.gif
          echo "OK seed reproduzível"
      - name: Render ASCII photo (mock)
        run: |
          python -m generator --ascii --mock --preview \
            --output "/tmp/ascii.gif"
          test -s "/tmp/ascii.gif"
          echo "OK ascii (mock)"
      - name: ASCII revela a grade progressivamente
        run: |
          python - <<'EOF'
          import math
          from PIL import Image, ImageDraw
          from generator import ascii_art as A
          from generator.render import load_font

          font = load_font(A.FONT_SIZE)
          ascent = font.getmetrics()[0]
          cw = ImageDraw.Draw(Image.new("RGBA", (4, 4))).textlength("M", font=font)
          ch = ascent
          grid = A.to_grid(A.mock_avatar(), 56, cw, ch)
          rows = len(grid)
          cols = 56
          W = int(cols * cw) + 2 * A.PAD
          H = rows * ch + 2 * A.PAD
          row_imgs = []
          for row in grid:
              s = Image.new("RGBA", (int(cols * cw), ch), (0, 0, 0, 0))
              ImageDraw.Draw(s).text((0, 0), row, font=font, fill=A.DEFAULT_INK)
              row_imgs.append(s)
          total = cols * rows
          cpf = max(1, total // int(24 * A.PRINT_SECONDS))
          n_print = math.ceil(total / cpf)
          first = A._compose(W, H, A.PAD, cw, ch, row_imgs, cols, cpf)
          last = A._compose(W, H, A.PAD, cw, ch, row_imgs, cols, total)
          ink = lambda img: sum(1 for p in img.convert("RGBA").get_flattened_data() if p[3] > 0)
          assert ink(first) > 0 and ink(last) > ink(first), (ink(first), ink(last))
          assert grid and all(len(r) == cols for r in grid), "grade inválida"
          print("OK progressão ASCII", ink(first), "->", ink(last))
          EOF
      - name: Fetch repos com paginação
        run: |
          python - <<'EOF'
          import re
          from generator import api

          pages = [[{"name": f"p{p}n{i:02d}", "stargazers_count": (3 - p) * 100 + i}
                    for i in range(100)] for p in range(1, 4)] \
                  + [[{"name": "repo-last", "stargazers_count": 5}]]
          calls = []

          def fake_get(url):
              calls.append(url)
              return pages[len(calls) - 1]

          api._get_json = fake_get
          out = api.fetch_repos("teste")
          pages_called = [int(re.search(r"[?&]page=(\d+)", u).group(1)) for u in calls]
          assert pages_called == [1, 2, 3, 4], pages_called
          counts = [i["count"] for i in out]
          assert counts == sorted(counts, reverse=True), "ranking fora de ordem"
          assert len(out) == 301, len(out)
          print("OK paginação")
          EOF
      - name: Fetch followers com paginação
        run: |
          python - <<'EOF'
          from generator import api

          pages = [[{"login": f"f{i:03d}", "avatar_url": ""} for i in range(100)]
                   for _ in range(2)] + [[{"login": "f-last", "avatar_url": ""}]]
          calls = []

          def fake_get(url):
              calls.append(url)
              return pages[len(calls) - 1]

          api._get_json = fake_get
          out = api.fetch_followers("teste")
          assert len(calls) == 3, calls
          assert len(out) == 201, len(out)
          assert all(i["count"] == 1 for i in out), "cada seguidor vale 1 ponto"
          assert out[0]["name"] == "f000", "ordem da API preservada"
          print("OK seguidores")
          EOF
