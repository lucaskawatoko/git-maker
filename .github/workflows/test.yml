name: test

on:
  push:
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render snake GIF with mock data
        run: |
          python -m generator --data repos --mock --preview \
            --output "/tmp/snake.gif"
          test -s "/tmp/snake.gif"
          echo "OK snake (repos)"
      - name: Render snake with custom hex colors
        run: |
          python -m generator --data commits --mock \
            --color "#aac8d6" --food "#e5534b" \
            --output "/tmp/snake-azul.gif"
          test -s "/tmp/snake-azul.gif"
          echo "OK snake (hex)"
