name: test

on:
  push:
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render snake GIF with mock data
        run: |
          python -m generator --data repos --mock --preview \
            --output "/tmp/snake.gif"
          test -s "/tmp/snake.gif"
          echo "OK snake (repos)"
      - name: Render snake with custom hex colors
        run: |
          python -m generator --data commits --mock \
            --color "#aac8d6" --food "#e5534b" \
            --output "/tmp/snake-azul.gif"
          test -s "/tmp/snake-azul.gif"
          echo "OK snake (hex)"
      - name: Fetch repos com paginação
        run: |
          python - <<'EOF'
          import re
          from generator import api

          pages = [[{"name": f"p{p}n{i:02d}", "size": (3 - p) * 100 + i}
                    for i in range(100)] for p in range(1, 4)] \
                  + [[{"name": "repo-last", "size": 5}]]
          calls = []

          def fake_get(url):
              calls.append(url)
              return pages[len(calls) - 1]

          api._get_json = fake_get
          out = api.fetch_repos("teste")
          pages_called = [int(re.search(r"[?&]page=(\d+)", u).group(1)) for u in calls]
          assert pages_called == [1, 2, 3, 4], pages_called
          counts = [i["count"] for i in out]
          assert counts == sorted(counts, reverse=True), "ranking fora de ordem"
          assert len(out) == 301, len(out)
          print("OK paginação")
          EOF
