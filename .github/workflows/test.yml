name: test

on:
  push:
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render snake GIF with mock data
        run: |
          python -m generator --data repos --mock --preview \
            --output "/tmp/snake.gif"
          test -s "/tmp/snake.gif"
          echo "OK snake (repos)"
      - name: Render snake with custom hex colors
        run: |
          python -m generator --data commits --mock \
            --color "#aac8d6" --food "#e5534b" \
            --output "/tmp/snake-azul.gif"
          test -s "/tmp/snake-azul.gif"
          echo "OK snake (hex)"
      - name: Render snake with followers (mock)
        run: |
          python -m generator --data followers --mock \
            --output "/tmp/snake-followers.gif"
          test -s "/tmp/snake-followers.gif"
          echo "OK snake (followers)"
      - name: Seeds diferentes geram caminhos diferentes
        run: |
          python -m generator --data repos --mock --seed 1 --output "/tmp/seed1.gif"
          python -m generator --data repos --mock --seed 2 --output "/tmp/seed2.gif"
          test -s "/tmp/seed1.gif" && test -s "/tmp/seed2.gif"
          ! cmp -s /tmp/seed1.gif /tmp/seed2.gif
          echo "OK seeds"
      - name: Seed fixo é reproduzível
        run: |
          python -m generator --data repos --mock --seed 7 --output "/tmp/r1.gif"
          python -m generator --data repos --mock --seed 7 --output "/tmp/r2.gif"
          cmp -s /tmp/r1.gif /tmp/r2.gif
          echo "OK seed reproduzível"
      - name: Smooth e no-smooth geram GIFs válidos
        run: |
          python -m generator --data repos --mock --smooth --output "/tmp/smooth.gif"
          python -m generator --data repos --mock --no-smooth --output "/tmp/no-smooth.gif"
          test -s "/tmp/smooth.gif" && test -s "/tmp/no-smooth.gif"
          echo "OK smooth/no-smooth"
      - name: Simulação marca finished quando come tudo
        run: |
          python - <<'EOF'
          import random
          from generator import snake

          items = [{"name": f"r{i}", "count": 10 - i, "level": 1} for i in range(5)]
          states = snake.simulate(items, random.Random(42))
          assert states[-1]["finished"] is True, "deveria ter comido todos"
          assert states[-1]["idx"] == 5, states[-1]["idx"]
          assert any(s.get("eat") for s in states), "sem eventos de eat"
          print("OK finished")
          EOF
      - name: Spawn não repete a célula excluída
        run: |
          python - <<'EOF'
          import random
          from generator import snake

          rng = random.Random(1)
          excluded = (snake.PLAY_ROW0, 0)
          occupied = set()
          for _ in range(200):
              cell = snake._spawn_food(rng, occupied, exclude=excluded)
              assert cell != excluded, f"repetiu a célula excluída {cell}"
          print("OK spawn exclude")
          EOF
      - name: Fetch repos ordena por estrelas (Search API) com paginação
        run: |
          python - <<'EOF'
          import re
          from urllib.parse import urlsplit, parse_qs
          from generator import api

          pages = [{"items": [{"name": f"p{p}n{i:02d}", "stargazers_count": (3 - p) * 100 + i}
                              for i in range(100)]} for p in range(1, 4)] \
                  + [{"items": [{"name": "repo-last", "stargazers_count": 5}]}]
          calls = []

          def fake_get(url):
              calls.append(url)
              return pages[len(calls) - 1]

          api._get_json = fake_get
          out = api.fetch_repos("teste")
          assert "search/repositories" in calls[0], calls[0]
          pages_called = [int(re.search(r"[?&]page=(\d+)", u).group(1)) for u in calls]
          assert pages_called == [1, 2, 3, 4], pages_called
          qs = parse_qs(urlsplit(calls[0]).query)
          assert qs["sort"] == ["stars"] and qs["order"] == ["desc"], qs
          assert "user:teste" in qs["q"][0] and "fork:false" in qs["q"][0], qs
          counts = [i["count"] for i in out]
          assert counts == sorted(counts, reverse=True), "ranking fora de ordem"
          assert len(out) == 301, len(out)
          print("OK paginação estrelas")
          EOF
      - name: Fetch followers com paginação
        run: |
          python - <<'EOF'
          from generator import api

          pages = [[{"login": f"f{i:03d}", "avatar_url": ""} for i in range(100)]
                   for _ in range(2)] + [[{"login": "f-last", "avatar_url": ""}]]
          calls = []

          def fake_get(url):
              calls.append(url)
              return pages[len(calls) - 1]

          api._get_json = fake_get
          out = api.fetch_followers("teste")
          assert len(calls) == 3, calls
          assert len(out) == 201, len(out)
          assert all(i["count"] == 1 for i in out), "cada seguidor vale 1 ponto"
          assert out[0]["name"] == "f000", "ordem da API preservada"
          print("OK seguidores")
          EOF
