name: test

on:
  push:
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render GIF with mock data
        run: |
          python -m generator --user lucaskawatoko --mock --preview \
            --output "/tmp/asteroids.gif"
          test -s "/tmp/asteroids.gif"
          echo "OK asteroids"
